version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: cosmetics_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cosmetics_products
    volumes:
      - mongo-data:/data/db
    networks:
      - cosmetics_network

networks:
  cosmetics_network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
